name: test
on:
  push:
    branches: [main]
    paths: ["tools/**", "tests/**", "schema/**", "policy/**", ".github/workflows/**"]   # tests/test_workflows.py tests the workflows
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r tools/requirements-dev.txt
      - run: python -m pytest -q tests
